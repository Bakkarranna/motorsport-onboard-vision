[project]
name = "onboardvision"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy<2",
    "opencv-python-headless>=4.10",
    "pandas>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "matplotlib>=3.9",
    "scipy>=1.14",
]

[project.scripts]
build-report = "onboardvision.scripts.build_report:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow_motion: full-duration motion tests that render 640x360 frames",
]
