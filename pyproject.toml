[project]
name = "onboardvision"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy<2",
    "opencv-python-headless>=4.10",
    "pandas>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "matplotlib>=3.9",
    "scipy>=1.14",
]

[project.scripts]
build-report = "onboardvision.scripts.build_report:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow_motion: full-duration motion tests that render 640x360 frames",
]

# Pin the rule set explicitly rather than relying on ruff's defaults, which grow
# with every release. An unpinned dependency meant a new ruff version could turn
# CI red without this repo changing, which is what happened four times.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Thread limits are read when the BLAS backend loads, so the numpy import has to
# stay below the os.environ calls. That is the case E402 exists to flag and it is
# wrong here.
"scripts/build_report.py" = ["E402"]
