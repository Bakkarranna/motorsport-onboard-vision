name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The motion suite renders real 640x360 footage (roughly 4.5 s of render
    # per long test), so give it room rather than skipping the slow tests.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # CI=true is what conftest.py looks for to unlock the full-duration
      # motion tests, so this is the whole suite, not the fast subset.
      - name: Test
        run: pytest tests/ -q
